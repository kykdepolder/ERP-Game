/* Layout follows abeam.com: black site header + black title band with giant serif "English ／ Bahasa" heading, full-bleed Light Beige content band, Dark Blue band for the result. Square, hairline-outlined boxes; Dark Beige filled CTA with chevron. */
:root{
  --black:#000000; --white:#ffffff; --gray:#333333;
  --beige-l:#f0ebe3; --beige:#c8beaa; --beige-d:#7d6e5a; --blue:#001964;
  --hair:#bdb4a3; --muted:#5c5448; --req:#d0021b;
  --serif:"Times New Roman",Tinos,"Noto Serif",Georgia,serif;
  --sans:"ABeam Segoe","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--sans);font-size:16px;line-height:1.7}
button,input,select,textarea{font-family:var(--sans)}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.in{max-width:1280px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--beige-d);outline-offset:2px}

/* site header */
.site{background:var(--black)}
.site .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px}
.logo{width:200px;height:auto;display:block}
.util{display:flex;align-items:center;gap:28px;font-size:15px;color:var(--white)}
.lang{display:flex;align-items:center;gap:2px;color:var(--gray)}
.lang button{font:inherit;font-size:15px;background:none;border:0;color:var(--beige);padding:4px 8px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--white);text-decoration:underline;text-underline-offset:5px}
.util .contact{border:1px solid var(--white);padding:3px 12px;color:var(--white)}

/* title band */
.hero{background:var(--black);position:relative;overflow:hidden}
.hero .in{padding-block:48px 0;position:relative;z-index:1;display:grid;gap:22px}
.hero::after{content:"";position:absolute;right:-20px;top:0;width:min(42%,560px);height:118px;pointer-events:none;background:var(--pat) right top/contain no-repeat;opacity:.95}
h1#ptitle{font-family:var(--serif);font-size:clamp(40px,6.4vw,84px);line-height:1.12;color:var(--white);letter-spacing:.005em}
.lead:empty{display:none}
.lead{font-size:17px;max-width:62ch;color:var(--white);opacity:.88}
.progress{display:grid;grid-template-columns:repeat(8,1fr);margin-top:26px}
.progress button{font:inherit;font-size:13px;line-height:1.4;background:none;border:0;border-top:1px solid var(--gray);color:var(--beige);padding:12px 8px 22px 0;text-align:left;cursor:pointer;display:flex;gap:6px}
.progress button.done{border-top:1px solid var(--beige-d);color:var(--white)}
.progress button.cur{border-top:3px solid var(--beige);color:var(--white);padding-top:10px}
.progress b{font-weight:400}

/* content band */
.band{background:var(--beige-l);color:var(--black)}
.band .in{padding-block:64px 80px;display:grid;gap:56px}
.band.blue{background:var(--blue);color:var(--white)}
.page{display:grid;gap:44px;min-width:0}
.page p{font-size:16px}
.q{display:grid;gap:14px;align-content:start;min-width:0}
.q > .ql,.q > label{font-family:var(--serif);font-size:26px;line-height:1.3;color:var(--black)}
.q .sub{font-size:14px;color:var(--muted);font-family:var(--sans)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px 36px}
.opts{display:flex;flex-wrap:wrap;gap:12px}
.opt{font:inherit;font-size:15px;line-height:1.4;background:transparent;border:1px solid var(--black);color:var(--black);padding:13px 22px;min-height:52px;cursor:pointer;text-align:left}
.opt:hover{background:var(--white)}
.opt[aria-pressed="true"]{background:var(--beige-d);border-color:var(--beige-d);color:var(--white)}
.opt:disabled{opacity:.4;cursor:not-allowed}

/* form, as on the abeam.com contact page */
.formcol{display:grid;gap:30px}
.formnote{font-size:16px}
.formcol .q > label{font-family:var(--sans);font-size:17px}
.req{color:var(--req);margin-left:2px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font-size:16px;color:var(--black);background:var(--white);border:1px solid #8c8c8c;padding:14px 16px;min-height:56px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--black);outline:none}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;max-width:90ch}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--blue)}

/* puzzle */
.heads,.pair{display:grid;grid-template-columns:1fr 96px 1fr}
.colhead{display:grid;gap:2px;padding-bottom:14px}
.colhead h2{font-family:var(--serif);font-size:36px;line-height:1.1}
.colhead.a h2{color:var(--beige-d)} .colhead.t h2{color:var(--blue)}
.colhead span{font-size:14px;color:var(--muted)}
.rows{display:grid}
.pair{width:100%;font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.piece{display:grid;gap:4px;align-content:start;padding:20px 22px;min-height:112px;height:100%}
.piece .step{font-size:13px;color:var(--muted)}
.piece .name{font-family:var(--serif);font-size:23px;line-height:1.2}
.piece .val{font-size:14px}
.piece.ap{background:var(--white);border:1px solid var(--beige-d)}
.piece.ap.empty{border-style:dashed}
.piece.tp{background:var(--white);border:1px dashed var(--blue)}
.piece.tp.set{background:var(--blue);border:1px solid var(--blue);color:var(--white)}
.piece.tp.set .step{color:var(--beige)}
.pair:hover .piece.ap{background:#faf8f4}
.pair.open .piece{outline:2px solid var(--black);outline-offset:-2px}
.conn{position:relative;display:grid;place-items:center}
.conn::before{content:"";position:absolute;left:0;right:8px;top:50%;height:2px;margin-top:-1px;background:var(--beige-d)}
.conn::after{content:"";position:absolute;right:2px;top:50%;width:12px;height:12px;margin-top:-6px;border-top:2px solid var(--beige-d);border-right:2px solid var(--beige-d);transform:rotate(45deg)}
.pair.set .conn::before{background:var(--blue)} .pair.set .conn::after{border-color:var(--blue)}
.conn .num{position:relative;z-index:1;width:36px;height:36px;display:grid;place-items:center;background:var(--black);color:var(--white);font-size:14px}
.link{display:flex;justify-content:flex-start;align-items:center;height:48px;padding-left:22px}
.link button{font:inherit;font-size:13px;background:transparent;padding:4px 14px;cursor:pointer}
.link button.on{border:1px solid var(--blue);color:var(--blue)}
.link button.unset{border:1px dashed var(--gray);color:var(--gray)}
a.btn{text-decoration:none}
.progress button:disabled{cursor:default;opacity:.55}
.link button.off{border:1px dashed var(--black);color:var(--black)}
.picker{background:var(--white);border:1px solid var(--black);padding:26px;margin:10px 0 14px;display:grid;gap:18px}
.picker.split{grid-template-columns:1fr 1fr;gap:32px}
.picker .side{display:grid;gap:12px;align-content:start;min-width:0;padding-top:14px}
.picker .side.a{border-top:3px solid var(--beige-d)} .picker .side.t{border-top:3px solid var(--blue)}
.tag-a,.tag-t{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.tag-a{color:var(--beige-d)} .tag-t{color:var(--blue)}
.picker .ql{font-family:var(--serif);font-size:19px}
.picker .opt{padding:9px 16px;min-height:44px;font-size:14px}
.picker .side.t .opt[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}

/* pains, readiness */
.pain{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pain .opt{min-height:76px;padding:18px 20px}
.mat{display:grid;gap:40px}

/* priorities */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.slot{border:1px dashed var(--black);padding:22px 24px;min-height:128px;display:grid;gap:6px;align-content:start;min-width:0}
.slot.filled{background:var(--blue);border:1px solid var(--blue);color:var(--white)}
.slot .rk{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.slot .sn{font-family:var(--serif);font-size:25px;line-height:1.2}
.slot:not(.filled) .sn{color:var(--muted);font-size:20px}
.slot .x{justify-self:start;font:inherit;font-size:13px;background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer}
.plist{display:grid;border-top:1px solid var(--hair)}
.pcard{display:grid;grid-template-columns:56px 1fr auto;gap:20px;align-items:center;width:100%;font:inherit;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:22px 8px;cursor:pointer}
.pcard:hover:not(:disabled){background:var(--white)}
.pcard .badge{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--black);font-family:var(--serif);font-size:20px}
.pcard.on .badge{background:var(--blue);border-color:var(--blue);color:var(--white)}
.pcard.dim{opacity:.4;cursor:not-allowed}
.pbody{display:grid;gap:4px;min-width:0}
.pbody .name{font-family:var(--serif);font-size:23px;line-height:1.25}
.flow{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;align-items:center}
.fa{color:var(--beige-d)} .arr{color:var(--black)}
.pcard .cta{font-size:14px;color:var(--blue);white-space:nowrap}
.pcard .cta:not(:empty)::after{content:"  ›"}

/* result, on the blue band */
.result{display:grid;gap:36px}
.next{list-style:none;padding:0;margin:0;display:grid;border-top:1px solid rgba(255,255,255,.5)}
.next li{display:grid;grid-template-columns:72px 1fr;gap:20px;padding:26px 0;border-bottom:1px solid rgba(255,255,255,.5)}
.next .no{font-family:var(--serif);font-size:40px;line-height:1;color:var(--beige)}
.next li div{display:grid;gap:8px;min-width:0}
.next b{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.25}
.next span{font-size:15px;opacity:.9;max-width:70ch}
.next em{font-style:normal;font-size:13px;color:var(--beige);letter-spacing:.02em}
.cta-row{display:flex}
.result .fine{font-size:13px}
@media(max-width:760px){.next li{grid-template-columns:44px 1fr;gap:12px}.next .no{font-size:28px}.next b{font-size:21px}}

.result .eyebrow{font-size:14px;letter-spacing:.08em;color:var(--beige)}
.score{display:flex;flex-wrap:wrap;gap:28px;align-items:baseline}
.big{font-family:var(--serif);font-size:clamp(84px,12vw,140px);line-height:1}
.arch{font-family:var(--serif);font-size:36px}
.result p{font-size:17px;max-width:70ch}
.result h3{font-family:var(--serif);font-size:34px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.svc div{position:relative;border:1px solid var(--white);padding:26px 44px 26px 26px;display:grid;gap:8px;min-width:0}
.svc div::after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:26px}
.svc b{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.25}
.svc span{font-size:14px;opacity:.85}

/* nav buttons */
.nav{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.btn{font:inherit;font-size:18px;display:inline-flex;justify-content:space-between;align-items:center;gap:24px;min-width:280px;padding:18px 28px;cursor:pointer;border:1px solid var(--beige-d);background:var(--beige-d);color:var(--white)}
.btn::after{content:"›";font-size:24px;line-height:1}
.btn.ghost{background:transparent;color:var(--black);border-color:var(--black);min-width:0;flex-direction:row-reverse}
.btn.ghost::after{content:"‹"}
.band.blue .btn.ghost{color:var(--white);border-color:var(--white)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.12)}

.band.blue .result p{color:var(--white)!important;opacity:.85}
@media (max-width:760px){
  .site .in{padding-block:16px}.logo{width:160px}.util{gap:14px}
  .hero .in{padding-top:28px}
  .hero::after{display:none}
  .progress button span{display:none}.progress button.cur span{display:inline}
  .band .in{padding-block:40px 56px;gap:40px}
  .heads,.pair{grid-template-columns:1fr 40px 1fr}
  .piece{padding:12px;min-height:96px}.piece .name{font-size:17px}.piece .val{font-size:13px}
  .conn .num{width:26px;height:26px;font-size:12px}
  .colhead h2{font-size:26px}
  .picker{padding:16px}.picker.split{grid-template-columns:1fr}
  .podium{grid-template-columns:1fr}.slot{min-height:0}
  .pcard{grid-template-columns:44px 1fr}.pcard .cta{grid-column:2}
  .q > .ql,.q > label{font-size:22px}
  .btn{min-width:0;flex:1}
  .link{padding-left:8px}
}
</style>

</head>

function asisScore(){const v=S.asis.map(k=>ASIS.find(a=>a.k===k)).filter(a=>a&&a.s!==null).map(a=>a.s);if(!v.length)return 0;const sys=v.reduce((a,b)=>a+b,0)/v.length;const integ=S.links.filter(x=>x===true).length/4*100;const mat=Object.values(S.mat).reduce((a,b)=>a+(b||0),0)/(MAT.length*3)*100;return Math.round(sys*0.4+integ*0.2+mat*0.4);}

// ===== Views =====
const VIEWS=[
()=>{const u=U();const pv=x=>PRIVACY_URL?`<a href="${PRIVACY_URL}" target="_blank" rel="noopener">${x}</a>`:`<u>${x}</u>`;
 return `<div class="formcol"><p class="formnote">${u.req}</p>
<div class="grid2">
 <div class="q"><label for="f-name">${u.fName}<span class="req">*</span></label><input id="f-name" type="text" autocomplete="name" data-f="name" value="${esc(S.name)}"></div>
 <div class="q"><label for="f-title">${u.fTitle}<span class="req">*</span></label><input id="f-title" type="text" autocomplete="organization-title" data-f="title" value="${esc(S.title)}"></div>
 <div class="q"><label for="f-company">${u.fCompany}<span class="req">*</span></label><input id="f-company" type="text" autocomplete="organization" data-f="company" value="${esc(S.company)}"></div>
 <div class="q"><label for="f-email">${u.fEmail}<span class="req">*</span></label><input id="f-email" type="email" autocomplete="email" data-f="email" value="${esc(S.email)}"></div>
 <div class="q"><label for="f-wa">${u.fWa}<span class="req">*</span></label><input id="f-wa" type="tel" autocomplete="tel" placeholder="+62" data-f="wa" value="${esc(S.wa)}"></div>
</div>
<label class="check"><input id="f-consent" type="checkbox" data-c="consent" ${S.consent?"checked":""}><span>${u.consent(pv)}</span></label>
<label class="check"><input id="f-mkt" type="checkbox" data-c="mkt" ${S.mkt?"checked":""}><span>${u.mkt}</span></label></div>`;},

()=>{const u=U();return `<div class="q"><span class="ql">${u.yourRole}<span class="req">*</span></span><div class="opts">${Object.entries(ROLES).map(([k,r])=>`<button type="button" class="opt" data-role="${k}" aria-pressed="${S.role===k}">${r.label}</button>`).join("")}</div></div>
<div class="grid2">
 <div class="q"><label for="f-ind">${u.industry}</label><select id="f-ind" data-f="industry"><option value="">${u.pick}</option>${INDUSTRY.map(o=>`<option value="${esc(o)}" ${S.industry===o?"selected":""}>${esc(t(o))}</option>`).join("")}</select></div>
 <div class="q"><span class="ql">${u.size}</span>${chips("size",SIZE)}</div>
</div>`;},

()=>{const u=U();const r=R();let h=`<div class="heads"><div class="colhead a"><h2>As-Is</h2><span>${u.asis}</span></div><div></div><div class="colhead t"><h2>To-Be</h2><span>${u.tobe}</span></div></div><div class="rows">`;
 r.steps.forEach((st0,i)=>{const st=t(st0);const a=ASIS.find(x=>x.k===S.asis[i]);const tb=S.tobe[i]||[];const set=tb.length&&!(tb.length===1&&tb[0]==="Tetap seperti sekarang");const op=S.open===i;
  h+=`<button type="button" class="pair${op?" open":""}${set?" set":""}" data-open="${i}" aria-expanded="${op}">
   <span class="piece ap${a?"":" empty"}"><span class="step">${u.step} ${i+1}</span><span class="name">${st}</span><span class="val">${a?t(a.t)+(S.health[i]?" · "+t(S.health[i]):""):u.tap}</span></span>
   <span class="conn" aria-hidden="true"><span class="num">${i+1}</span></span>
   <span class="piece tp${set?" set":""}"><span class="step">${u.step} ${i+1}</span><span class="name">${st}</span><span class="val">${tb.length?tb.map(t).join(" · "):u.tap}</span></span>
  </button>`;
  if(op){h+=`<div class="picker split"><div class="side a"><div class="tag-a">As-Is · ${st}</div>
   <div class="ql">${u.qSys}</div><div class="opts">${ASIS.map(o=>`<button type="button" class="opt" data-asis="${i}" data-v="${o.k}" aria-pressed="${S.asis[i]===o.k}">${t(o.t)}</button>`).join("")}</div>
   <div class="ql">${u.qAge}</div>${chips("age",AGE,false,i)}
   <div class="ql">${u.qHealth}</div>${chips("health",HEALTH,false,i)}
   <div class="ql">${u.qUsers}</div>${chips("users",USERS,false,i)}</div>
   <div class="side t"><div class="tag-t">To-Be · ${st}</div><div class="ql">${u.qTobe}</div>${chips("tobe",TOBE,true,i)}</div></div>`;}
  if(i<4){const on=S.links[i];h+=`<div class="link"><button type="button" class="${on===true?"on":on===false?"off":"unset"}" data-link="${i}" aria-pressed="${on===true}">${on===true?u.linkOn:on===false?u.linkOff:u.linkNull}</button></div>`;}
 });
 return h+`</div>`;},

()=>{const u=U();const pb=p=>`<button type="button" class="opt" data-k="pains" data-m="1" data-v="${esc(p)}" aria-pressed="${S.pains.includes(p)}">${t(p)}</button>`;
 return `<div class="q"><span class="ql">${u.special(R().label)}</span><div class="pain">${R().pains.map(pb).join("")}</div></div>
<div class="q"><span class="ql">${u.common}</span><div class="pain">${COMMON_PAINS.map(pb).join("")}</div></div>
<div class="q"><label for="f-po">${u.painOther} <span class="sub">${u.opt}</span></label><textarea id="f-po" data-f="painOther">${esc(S.painOther)}</textarea></div>`;},

()=>`<div class="mat">${MAT.map(m=>`<div class="q"><span class="ql">${t(m.q)}</span><div class="opts">${m.lv.map((l,i)=>`<button type="button" class="opt" data-mat="${m.k}" data-v="${i}" aria-pressed="${S.mat[m.k]===i}">${t(l)}</button>`).join("")}</div></div>`).join("")}</div>`,

()=>{const u=U();const st=R().steps.map(t);
 let h=`<div class="podium">${[0,1,2].map(n=>{const i=S.rank[n];return `<div class="slot${i!==undefined?" filled":""}"><span class="rk">${u.prio} #${n+1}</span><span class="sn">${i!==undefined?st[i]:u.notPicked}</span>${i!==undefined?`<button type="button" class="x" data-rank="${i}" aria-label="${u.release} ${st[i]}">${u.release}</button>`:""}</div>`}).join("")}</div>
 <p>${S.rank.length<3?u.more(3-S.rank.length):u.full}</p><div class="plist">`;
 st.forEach((s0,i)=>{const a=ASIS.find(x=>x.k===S.asis[i]);const tb=S.tobe[i]||[];const rk=S.rank.indexOf(i);const full=S.rank.length>=3&&rk===-1;
  h+=`<button type="button" class="pcard${rk>-1?" on":""}${full?" dim":""}" data-rank="${i}" aria-pressed="${rk>-1}" ${full?"disabled":""}>
   <span class="badge">${rk>-1?"#"+(rk+1):"+"}</span>
   <span class="pbody"><span class="name">${s0}</span><span class="flow"><span class="fa">${a?t(a.t):u.notFilled}</span><span class="arr">→</span><span class="ft">${tb.length?tb.map(t).join(", "):u.notFilled}</span></span></span>
   <span class="cta">${rk>-1?u.prio+" #"+(rk+1):full?"":u.makePrio(S.rank.length+1)}</span>
  </button>`;});
 return h+`</div><div class="q"><span class="ql">${u.target}</span>${chips("target",TARGET)}</div>`;},

()=>{const u=U();return `<div class="grid2">
 <div class="q"><span class="ql">${u.tStart}</span>${chips("timeline",TIMELINE)}</div>
 <div class="q"><span class="ql">${u.tBudget}</span>${chips("budget",BUDGET)}</div>
 <div class="q"><span class="ql">${u.tDecision}</span>${chips("decision",DECISION)}</div>
</div>
<div class="q"><span class="ql">${u.tCons}</span><span class="sub">${u.multi}</span>${chips("constraints",CONSTRAINTS,true)}</div>
<div class="q"><label for="f-goal">${u.tGoal}</label><textarea id="f-goal" data-f="goal">${esc(S.goal)}</textarea></div>`;},

()=>{const u=U();const rec=recommend();const st=R().steps.map(t);
 return `<div class="result"><span class="eyebrow">${esc(S.company)} · ${R().label}</span>
 <p>${u.yourPrio}: ${S.rank.length?S.rank.map((i,n)=>`#${n+1} ${st[i]}`).join(", "):u.noPrio}. ${u.broken(S.links.filter(x=>x===false).length)}</p>
 <h3>${u.nextH}</h3>
 <ol class="next">${rec.map((r,n)=>`<li><span class="no">${String(n+1).padStart(2,"0")}</span><div><b>${esc(r.a)}</b><span>${esc(r.w)}</span><em>${u.by}: ${esc(svc(r.s))}</em></div></li>`).join("")}</ol>
 ${CTA_URL?`<div class="cta-row"><a class="btn cta" href="${CTA_URL}" target="_blank" rel="noopener">${u.cta}</a></div>`:""}
 <p class="fine">${u.follow}</p></div>`;}
];

// ===== Next-step logic (bilingual) =====
function recommend(lang){const en=(lang||L)==="en";const tt=s=>en&&DICT[s]?DICT[s]:s;
 const out=[];const add=(p,a,w,s)=>{if(!out.some(o=>o.s===s))out.push({p,a,w,s});};
 const st=R().steps.map(tt);const nm=ix=>ix.map(i=>st[i]).join(", ");const proc=tt(R().process);
 const idx=f=>S.asis.map((k,i)=>f(k)?i:-1).filter(i=>i>=0);
 const old=idx(k=>k==="ecc"||k==="legacy"),man=idx(k=>k==="manual"||k==="excel");
 const brk=[0,1,2,3].filter(i=>S.links[i]===false);const all=S.tobe.flat();
 const pri=S.rank;const hit=ix=>ix.some(i=>pri.includes(i))?2:0;
 if(pri.length){const i=pri[0];const caps=(S.tobe[i]||[]).filter(c=>c!=="Tetap seperti sekarang").slice(0,3).map(c=>tt(c).toLowerCase());
  add(5,en?`Start with ${st[i]}`:`Mulai dari ${st[i]}`,
   en?`This is your priority #1.${caps.length?` Target state: ${caps.join(", ")}.`:""} Map how it runs today, then define a 90-day quick win.`
     :`Ini prioritas #1 Anda.${caps.length?` Target kondisi ideal: ${caps.join(", ")}.`:""} Petakan dulu alurnya hari ini, lalu tentukan quick win 90 hari.`,R().bonus);}
 if(old.length)add(3+hit(old),en?"Plan the move off your legacy ERP":"Rencanakan migrasi dari ERP lama",
   en?`${nm(old)} still run${old.length>1?"":"s"} on a legacy ERP or SAP ECC. SAP ECC mainstream maintenance ends at the end of 2027, so start with a migration readiness assessment.`
     :`${nm(old)} masih berjalan di ERP lama atau SAP ECC. Dukungan mainstream SAP ECC berakhir akhir 2027, jadi mulai dengan assessment kesiapan migrasi.`,"SAP S/4HANA migration (RISE / GROW with SAP)");
 if(man.length>=2||(S.mat.process!==null&&S.mat.process<=1))add(3+hit(man),en?"Standardise the steps that are still manual":"Standarkan proses yang masih manual",
   en?`${man.length?nm(man):"Several steps"} still rely on manual work or Excel. Streamline and standardise them before automating, so a new system does not automate the wrong process.`
     :`${man.length?nm(man):"Beberapa langkah"} masih manual atau Excel. Rapikan dan standarkan alurnya sebelum diotomatisasi, supaya sistem baru tidak mengotomasi proses yang salah.`,"Business Process Re-engineering & process mining");
 if(man.length>=3&&!old.length&&!S.asis.includes("cloud"))add(2,en?`Set up one core system for ${proc}`:`Siapkan satu sistem inti untuk ${proc}`,
   en?"No single system connects the process end to end. Define your requirements and shortlist solutions.":"Belum ada sistem yang menyatukan proses dari awal sampai akhir. Susun kebutuhan dan shortlist solusi.","ERP implementation");
 if(brk.length>=2||all.includes("Terintegrasi ke sistem lain"))add(3+hit(brk.flatMap(i=>[i,i+1])),en?"Reconnect the broken data links":"Hubungkan sambungan data yang putus",
   en?`${brk.length?brk.map(i=>`${st[i]} to ${st[i+1]}`).join(", "):"Several hand-offs"} ${brk.length>1||!brk.length?"are":"is"} still re-entered manually. Start from one shared data source for every step.`
     :`${brk.length?brk.map(i=>`${st[i]} ke ${st[i+1]}`).join(", "):"Beberapa sambungan"} masih dipindah manual. Mulai dari satu sumber data yang sama untuk semua langkah.`,"Enterprise Architecture & integrasi");
 if(all.includes("Dashboard real-time")||all.includes("AI-assisted")||(S.mat.data!==null&&S.mat.data<=1))add(2,en?"Build the data foundation before dashboards and AI":"Siapkan fondasi data sebelum dashboard dan AI",
   en?"Real-time dashboards and AI are only as good as the data behind them. Agree on data definitions, owners and minimum quality.":"Dashboard real-time dan AI hanya seakurat datanya. Tetapkan definisi data, pemilik data, dan kualitas minimal.","Data & AI");
 if((S.mat.gov!==null&&S.mat.gov<=1)||S.timeline==="Belum ada rencana")add(2,en?"Build a DX roadmap and appoint an executive sponsor":"Susun roadmap DX dan tunjuk sponsor eksekutif",
   en?"Without a roadmap and sponsor, initiatives tend to stall at pilot stage. Agree on targets, sequence and a 12-month budget.":"Tanpa roadmap dan sponsor, inisiatif cenderung berhenti di pilot. Sepakati target, urutan, dan anggaran 12 bulan.","DX Strategy & Operating Model");
 add(1,en?`Review your ${proc} process end to end`:`Tinjau proses ${proc} secara menyeluruh`,en?`A relevant next step for a ${R().label}.`:`Langkah lanjutan yang relevan untuk ${R().label}.`,R().bonus);
 return out.sort((a,b)=>b.p-a.p).slice(0,3);}

function leadScore(){let f=0,i=0;f+=S.size==="1.001–5.000"||S.size==="5.000+"?20:S.size==="201–1.000"?12:0;f+=/director|head|manager|chief|vp|kepala|gm|direktur/i.test(S.title)?20:5;f+=10;
 i+=S.timeline==="< 6 bulan"||S.timeline==="6–12 bulan"?15:0;i+=S.budget==="Sudah dialokasikan"?15:S.budget==="Sedang diajukan"?8:0;i+=S.decision==="Pengambil keputusan"?20:S.decision==="Memberi rekomendasi"?10:0;return f+i;}

// ===== Submission to Netlify Forms (values stored in Bahasa Indonesia for consistency) =====
function payload(){const st=R().steps;const ls=leadScore();const rec=recommend("id");
 const asis=st.map((s,i)=>`${s}: ${(ASIS.find(a=>a.k===S.asis[i])||{}).t||"-"} | ${S.age[i]||"-"} | ${S.health[i]||"-"} | ${S.users[i]||"-"}${i<4?` | ke langkah berikut: ${S.links[i]===true?"otomatis":S.links[i]===false?"manual":"-"}`:""}`).join("\n");
 const tobe=st.map((s,i)=>`${s}: ${(S.tobe[i]||[]).join(", ")||"-"}`).join("\n");
 return {"form-name":FORM_NAME,name:S.name,job_title:S.title,company:S.company,email:S.email,whatsapp:S.wa,
  consent_processing:S.consent?"ya":"tidak",consent_marketing:S.mkt?"ya":"tidak",language:L,submitted_at:new Date().toISOString(),
  role:R().label,process:R().process,industry:S.industry,employee_band:S.size,as_is:asis,to_be:tobe,
  pain_points:S.pains.join("; "),pain_other:S.painOther,
  maturity:MAT.map(m=>`${m.q}: ${S.mat[m.k]===null?"-":m.lv[S.mat[m.k]]}`).join("; "),
  priority_rank:S.rank.map((i,n)=>`#${n+1} ${st[i]}`).join("; "),target_solution:S.target,
  timeline:S.timeline,budget:S.budget,decision_role:S.decision,constraints:S.constraints.join("; "),goal_12m:S.goal,
  next_steps:rec.map(r=>r.a).join("; "),services:rec.map(r=>r.s).join("; "),
  dx_score:String(asisScore()),lead_score:String(ls),lead_tier:ls>=70?"Hot":ls>=40?"Warm":"Cold"};}
function submit(){if(S.sent)return;S.sent=true;const body=new URLSearchParams(payload()).toString();
 try{fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body}).catch(()=>{});}catch(e){}}

// ===== Render & events =====
function canNext(p){p=p===undefined?S.page:p;
 if(p===0)return !!(S.name.trim()&&S.title.trim()&&S.company.trim()&&/^\S+@\S+\.\S+$/.test(S.email.trim())&&/^\+?[\d\s-]{9,}$/.test(S.wa.trim())&&S.consent);
 if(p===1)return !!S.role;return true;}
function render(){const u=U();
 document.documentElement.lang=L;
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===L));
 $("ptitle").textContent=u.titles[S.page];
 $("hero").style.setProperty("--pat",`url(${PAT[PAT_ORDER[S.page]]})`);
 $("plead").textContent=S.page===7?u.basedOn(R().label,S.company.trim()):(S.page===2?`${u.flow} ${t(R().process)}. `:"")+u.leads[S.page];
 $("band").classList.toggle("blue",S.page===7);
 $("progress").innerHTML=u.pages.map((p,i)=>`<button type="button" data-go="${i}" class="${i<S.page?"done":i===S.page?"cur":""}" aria-current="${i===S.page?"step":"false"}" ${i>S.max?"disabled":""}><b>${i+1}</b><span>${p}</span></button>`).join("");
 $("page").innerHTML=VIEWS[S.page]();
 $("back").textContent=u.back;$("back").disabled=S.page===0;
 $("next").textContent=S.page===6?u.see:S.page===7?u.restart:u.next;
 $("next").disabled=!canNext();
}
function go(p){S.page=p;S.max=Math.max(S.max,p);S.open=null;render();scrollTo(0,0);}
document.addEventListener("input",e=>{const f=e.target.dataset.f;if(f){S[f]=e.target.value;$("next").disabled=!canNext();}});
document.addEventListener("change",e=>{const c=e.target.dataset.c;if(c){S[c]=e.target.checked;$("next").disabled=!canNext();}const f=e.target.dataset.f;if(f&&e.target.tagName==="SELECT")S[f]=e.target.value;});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.lang){L=d.lang;render();return;}
 if(d.go!==undefined){const p=+d.go;if(p<=S.max){go(p);}return;}
 if(b.id==="back"){go(Math.max(0,S.page-1));return;}
 if(b.id==="next"){if(!canNext())return;
  if(S.page===7){S.sent=false;S.max=1;Object.assign(S,blank(),{mat:{process:null,data:null,tech:null,gov:null},target:"",timeline:"",budget:"",decision:"",constraints:[],goal:"",painOther:"",role:""});go(1);return;}
  if(S.page===6)submit();go(S.page+1);return;}
 if(d.role){if(S.role!==d.role){S.role=d.role;Object.assign(S,blank());}render();return;}
 if(d.open!==undefined){S.open=S.open===+d.open?null:+d.open;render();return;}
 if(d.asis!==undefined){S.asis[+d.asis]=S.asis[+d.asis]===d.v?"":d.v;render();return;}
 if(d.link!==undefined){const i=+d.link;S.links[i]=S.links[i]!==true;render();return;}
 if(d.mat){S.mat[d.mat]=S.mat[d.mat]===+d.v?null:+d.v;render();return;}
 if(d.rank!==undefined){const i=+d.rank;const p=S.rank.indexOf(i);if(p>-1)S.rank.splice(p,1);else if(S.rank.length<3)S.rank.push(i);render();return;}
 if(d.k){const k=d.k,v=d.v;
  if(d.i!==undefined){const i=+d.i;if(d.m){let arr=S[k][i]||[];if(v==="Tetap seperti sekarang")arr=arr.includes(v)?[]:[v];else{arr=arr.filter(x=>x!=="Tetap seperti sekarang");arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];}S[k][i]=arr;}else S[k][i]=S[k][i]===v?"":v;}
  else if(d.m){S[k]=S[k].includes(v)?S[k].filter(x=>x!==v):[...S[k],v];}
  else S[k]=S[k]===v?"":v;
  render();}
});
render();
</script>
